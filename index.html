<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Rates Adjustments Admin</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { margin: 0; color: #1a2445; font-size: 26px; }
        .status { padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; background: #e6f4ea; color: #1e8e3e; }
        .status.loading { background: #fff0d4; color: #b05c0d; }
        
        .section-title { font-size: 20px; color: #1a2445; border-bottom: 2px solid #d4af37; padding-bottom: 5px; margin-top: 30px; margin-bottom: 15px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .card { background: #fafafa; border: 1px solid #eaeaea; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card label { font-size: 14px; font-weight: 600; color: #555; }
        .card input[type="number"] { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 18px; font-weight: bold; color: #1a2445; transition: border-color 0.2s; }
        .card input[type="number"]:focus { border-color: #d4af37; outline: none; box-shadow: 0 0 5px rgba(212, 175, 55, 0.3); }
        
        /* Toggle Switch Styles */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #1e8e3e; }
        input:focus + .slider { box-shadow: 0 0 1px #1e8e3e; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* ── Notice / Remark Section ── */
        .notice-card {
            background: #fffbf0;
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            margin-top: 10px;
        }
        .notice-card .notice-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .notice-card .notice-label {
            font-size: 15px;
            font-weight: 700;
            color: #1a2445;
        }
        .notice-toggle-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }
        .notice-toggle-wrap .switch { width: 48px; height: 24px; }
        .notice-toggle-wrap .slider:before { height: 18px; width: 18px; }
        .notice-toggle-wrap input:checked + .slider:before { transform: translateX(24px); }

        .notice-status-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #fee2e2;
            color: #b91c1c;
            transition: all 0.3s;
        }
        .notice-status-badge.on { background: #dcfce7; color: #15803d; }

        #noticeText {
            width: 100%;
            min-height: 90px;
            padding: 14px;
            border: 1px solid #d4af37;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            background: #fff;
            color: #1a2445;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #noticeText:focus { border-color: #b8960a; outline: none; box-shadow: 0 0 6px rgba(212,175,55,0.4); }
        .notice-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #888;
        }

        .btn-wrapper { margin-top: 40px; display: flex; justify-content: center; }
        .btn { background: #1a2445; color: #d4af37; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(26, 36, 69, 0.3); }
        .btn:hover { background: #0f1835; transform: translateY(-2px); }
        .btn:disabled { background: #ccc; color: #fff; cursor: not-allowed; transform: none; box-shadow: none; }

        #toast { visibility: hidden; min-width: 250px; background-color: #1e8e3e; color: #fff; text-align: center; border-radius: 8px; padding: 16px; font-weight: bold; font-size: 16px; position: fixed; z-index: 1000; bottom: 30px; left: 50%; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        #toast.error { background-color: #d93025; }
        
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Admin Panel: Live Rates Adjustments</h1>
            <div id="statusIndicator" class="status loading">Loading data...</div>
        </div>

        <!-- ── Notice / Remark Section ── -->
        <h2 class="section-title">📢 App Notice / Remark</h2>
        <div class="notice-card">
            <div class="notice-top">
                <span class="notice-label">Popup Notification for Users</span>
                <div class="notice-toggle-wrap">
                    <span id="noticeStatusBadge" class="notice-status-badge">OFF</span>
                    <label class="switch" title="Toggle notice popup on/off">
                        <input type="checkbox" id="noticeToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <textarea id="noticeText" placeholder="Type your notice or remark here... (e.g. 'Market is closed today due to holiday.')"></textarea>
            <p class="notice-hint">💡 When toggle is <strong>ON</strong>, users will see this as a popup when they open the Live Rates page.</p>
        </div>

        <div id="content">
            <!-- Dynamic Groups will be inserted here -->
        </div>

        <div class="btn-wrapper">
            <button id="saveBtn" class="btn" disabled>Save Adjustments to Live App</button>
        </div>
    </div>

    <div id="toast">Saved Successfully!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRaCm8nP_rmN9QNQMAPg0ebKmN5nHKp1Q",
            authDomain: "sjapp-30321.firebaseapp.com",
            projectId: "sjapp-30321",
            storageBucket: "sjapp-30321.firebasestorage.app",
            messagingSenderId: "897139797873",
            appId: "1:897139797873:web:7a82cdcaf0345265d150d0",
            measurementId: "G-3XG02NE4F5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const adjustmentsDocRef = doc(db, 'settings', 'adjustments');

        const groups = {
            "Gold Base Rates": [
                "Gold 24K MCX", "Gold 22K MCX", "Gold 18K MCX",
                "Gold 22K Ornament", "Gold 18K Ornament", "Gold 14K Ornament",
            ],
            "Silver Base Rates": [
                "Silver 999 MCX", "Silver 999 Per Gram"
            ],
            "MMTC Silver Collection": [
                "MMTC Silver 10 GM 999", "MMTC Silver 20 GM 999", "MMTC Silver 50 GM 999",
                "MMTC Silver 100 GM 999", "MMTC Silver 250 GM 999", "MMTC Silver 500 GM 999", "MMTC Silver 1000 GM 999"
            ],
            "MMTC Gold Collection & Pasa Bhav": [
                "Gold 24K 1GM(Pasa Bhav)", "MMTC Gold Coin 0.5 GM", "MMTC Gold Coin 1 GM",
                "MMTC Gold Coin 2 GM", "MMTC Gold Coin 4 GM", "MMTC Gold Coin 5 GM",
                "MMTC Gold Coin 8 GM", "MMTC PAMP 10 GM", "MMTC Gold Coin 20 GM",
                "MMTC Gold Coin 50 GM", "MMTC Gold Coin 100 GM"
            ]
        };

        const contentDiv = document.getElementById('content');
        const saveBtn = document.getElementById('saveBtn');
        const statusInd = document.getElementById('statusIndicator');
        const noticeToggle = document.getElementById('noticeToggle');
        const noticeText = document.getElementById('noticeText');
        const noticeStatusBadge = document.getElementById('noticeStatusBadge');

        // Update badge label when toggle changes
        noticeToggle.addEventListener('change', () => {
            noticeStatusBadge.textContent = noticeToggle.checked ? 'ON' : 'OFF';
            noticeStatusBadge.className = 'notice-status-badge' + (noticeToggle.checked ? ' on' : '');
        });

        // Render HTML structure for rate groups
        for (const [groupName, keys] of Object.entries(groups)) {
            const section = document.createElement('div');
            section.innerHTML = `<h2 class="section-title">${groupName}</h2>`;
            
            const grid = document.createElement('div');
            grid.className = 'grid';
            
            for (const key of keys) {
                const safeId = key.replace(/[^a-zA-Z0-9]/g, '_');
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <label for="${safeId}">${key}</label>
                            <label class="switch" title="Toggle visibility in app">
                                <input type="checkbox" id="${safeId}_visible" data-visible-key="${key}" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <input type="number" step="any" id="${safeId}" data-key="${key}" value="0">
                    </div>
                `;
            }
            
            section.appendChild(grid);
            contentDiv.appendChild(section);
        }

        async function fetchInitialData() {
            try {
                const docSnap = await getDoc(adjustmentsDocRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Set number inputs
                    const inputs = document.querySelectorAll('input[type="number"]');
                    inputs.forEach(input => {
                        const key = input.getAttribute('data-key');
                        if (data[key] !== undefined) {
                            input.value = data[key];
                        }
                    });

                    // Set checkbox toggles for visibility
                    const checkboxes = document.querySelectorAll('input[data-visible-key]');
                    checkboxes.forEach(cb => {
                        const key = cb.getAttribute('data-visible-key');
                        const visibleKey = key + '_visible';
                        if (data[visibleKey] !== undefined) {
                            cb.checked = data[visibleKey];
                        } else {
                            cb.checked = true;
                        }
                    });

                    // Set notice remark fields
                    if (data['notice_text'] !== undefined) {
                        noticeText.value = data['notice_text'];
                    }
                    const noticeActive = data['notice_active'] === true;
                    noticeToggle.checked = noticeActive;
                    noticeStatusBadge.textContent = noticeActive ? 'ON' : 'OFF';
                    noticeStatusBadge.className = 'notice-status-badge' + (noticeActive ? ' on' : '');
                }
                statusInd.textContent = "Connected to Live App";
                statusInd.className = "status connected";
                saveBtn.disabled = false;
            } catch (error) {
                console.error("Error fetching data:", error);
                statusInd.textContent = "Error loading data. Check console.";
                statusInd.className = "status loading";
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = isError ? "show error" : "show";
            setTimeout(() => { toast.className = toast.className.replace(/show|error/g, ""); }, 3000);
        }

        saveBtn.addEventListener('click', async () => {
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            
            const dataToSave = {};
            
            // Collect number values
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                const key = input.getAttribute('data-key');
                let val = input.value.trim();
                dataToSave[key] = val === "" ? "0" : val;
            });

            // Collect toggle values for visibility
            const checkboxes = document.querySelectorAll('input[data-visible-key]');
            checkboxes.forEach(cb => {
                const key = cb.getAttribute('data-visible-key');
                dataToSave[key + '_visible'] = cb.checked;
            });

            // Collect notice / remark values
            dataToSave['notice_text'] = noticeText.value.trim();
            dataToSave['notice_active'] = noticeToggle.checked;

            try {
                await setDoc(adjustmentsDocRef, dataToSave, { merge: true });
                showToast("Adjustments applied successfully!");
            } catch (error) {
                console.error("Error writing document:", error);
                showToast("Failed to save!", true);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Adjustments to Live App';
            }
        });

        fetchInitialData();
    </script>
</body>
</html>
